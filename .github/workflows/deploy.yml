name: Deploy to GCP

# main 브랜치에 push가 발생할 때마다 로봇이 작동합니다.
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 최신 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 자바 17 세팅하기
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 그래들(Gradle) 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 스프링 부트 프로젝트 빌드 (테스트와 문서 생성 모두 건너뜁니다)
      - name: Build with Gradle
        run: ./gradlew clean build -x test -x asciidoctor

      # 5. 빌드된 .jar 파일을 GCP 서버로 전송 (SCP)
      - name: Transfer JAR to GCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "~/exchange-project/app"
          strip_components: 2

      # 6. GCP 서버에 접속해서 기존 서버 끄고 새 서버 실행 (SSH)
      - name: Execute JAR on GCP
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            # 8080 포트를 쓰고 있는 기존 스프링 부트 강제 종료
            sudo fuser -k -n tcp 8080 || true
            
            # 파일이 전송된 폴더로 이동
            cd ~/exchange-project/app
            
            # 깃허브 금고에서 환경변수 꺼내서 서버에 임시 주입
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            
            # 백그라운드에서 새로운 .jar 파일 실행 (로그는 app.log에 저장)
            nohup java -jar *.jar > app.log 2>&1 &