name: Deploy to GCP

# main 브랜치에 push가 발생할 때마다 로봇이 작동합니다.
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 최신 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 자바 17 세팅하기
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 그래들(Gradle) 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 스프링 부트 프로젝트 빌드 (테스트와 문서 생성 모두 건너뜁니다)
      - name: Build with Gradle
        run: ./gradlew clean build -x test -x asciidoctor

      # 5. 빌드된 .jar 파일을 GCP 서버로 전송 (SCP)
      - name: Transfer JAR to GCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "~/exchange-project/app"
          strip_components: 2

      # 6. GCP 서버에 접속해서 기존 서버 끄고 새 서버 실행 (SSH)
      - name: Execute JAR on GCP
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            # 1. 기존 자바 프로세스 확실하게 저격해서 죽이기
            sudo pkill -f java || true
            
            # 2. 포트가 완전히 닫히고 찌꺼기가 사라질 때까지 10초 대기 (핵심!!!)
            sleep 10
            
            # 3. 파일이 전송된 폴더로 이동
            cd ~/exchange-project/app
            
            # 4. 새로운 서버 실행
            nohup java -DDB_PASSWORD="${{ secrets.DB_PASSWORD }}" -DJWT_SECRET="${{ secrets.JWT_SECRET }}" -jar *.jar > app.log 2>&1 &