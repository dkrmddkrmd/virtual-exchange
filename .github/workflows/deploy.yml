name: Deploy to Oracle Cloud

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test -x asciidoctor

      - name: Transfer JAR to Oracle
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "~/virtual-exchange/virtual-exchange/build/libs"
          strip_components: 2

      - name: Execute JAR on Oracle
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sudo fuser -k -n tcp 8080 || true
            cd ~/virtual-exchange/virtual-exchange
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" \
            MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
            SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
            nohup java -jar build/libs/virtual-exchange-0.0.1-SNAPSHOT.jar > app.log 2>&1 &