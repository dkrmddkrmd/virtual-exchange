spring:
  profiles:
    active: local # 현재 환경을 로컬(local)로 설정!
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/virtual_exchange_log
      auto-index-creation: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  application:
    name: virtual-exchange

  datasource:
    # docker run 명령어로 띄운 DB 정보와 일치해야 합니다.
    url: jdbc:mysql://localhost:3306/stock_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    # 서버 켤 때마다 Entity(자바 객체)랑 DB 테이블을 비교해서 다르면 업데이트해줌 (개발용 꿀기능)
    hibernate:
      ddl-auto: update
    # 실행되는 SQL 쿼리를 로그에 보여줌
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092 # 카프카 주소 (도커가 9092로 열어줌)
    consumer:
      group-id: stock-group # 우리 서비스 이름표 (컨슈머 그룹)
      auto-offset-reset: latest # 가장 최근 메시지부터 읽겠다
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET}

server:
  forward-headers-strategy: native
  servlet:
    session:
      persistent: false

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL}