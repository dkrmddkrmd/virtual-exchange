<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>거래 내역</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 테이블 헤더 스타일 (기존 자산 현황 페이지와 통일) */
        .table thead th {
            background-color: #212529;
            color: white;
            vertical-align: middle;
            text-align: center;
        }
        .table tbody td {
            vertical-align: middle;
            text-align: center;
        }
        /* 한국 주식 시장 색상: 매수(빨강), 매도(파랑) */
        .text-buy { color: #dc3545; font-weight: bold; }
        .text-sell { color: #0d6efd; font-weight: bold; }
        .badge-buy { background-color: #dc3545; }
        .badge-sell { background-color: #0d6efd; }
    </style>
</head>
<body class="container mt-5 mb-5">

<th:block th:replace="~{fragments/header :: headerFragment}"></th:block>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>📜 거래 내역</h1>
    <div>
        <a href="/stocks" class="btn btn-outline-secondary me-2">주식 거래소</a>
        <a href="/my-assets" class="btn btn-outline-primary">내 자산 현황</a>
    </div>
</div>

<div class="card mb-4 shadow-sm">
    <div class="card-body d-flex justify-content-between align-items-center">
        <span class="fs-5">최근 거래 내역을 보여줍니다.</span>
        <button class="btn btn-sm btn-outline-dark" onclick="location.reload()">🔄 목록 새로고침</button>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-hover table-bordered align-middle">
        <thead class="table-dark">
        <tr>
            <th>주문 일시</th>
            <th>종목명</th>
            <th>종류</th>
            <th>수량</th>
            <th>체결 단가</th>
            <th>총 거래액</th>
        </tr>
        </thead>
        <tbody id="orderListBody">
        <tr><td colspan="6" class="text-center py-4">데이터를 불러오는 중...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // 1. 유저 ID (테스트용)
    const USER_ID = 29;

    // 2. 페이지 로딩 시 데이터 조회
    document.addEventListener("DOMContentLoaded", () => {
        fetchOrderList();
    });

    function fetchOrderList() {
        // 백엔드 컨트롤러: OrderController의 @GetMapping("/api/orders/list")
        fetch(`/api/orders/list?userId=${USER_ID}`)
            .then(response => {
                if (!response.ok) throw new Error("네트워크 응답 실패");
                return response.json();
            })
            .then(data => {
                renderOrderList(data);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('orderListBody').innerHTML =
                    '<tr><td colspan="6" class="text-danger text-center">거래 내역을 불러오지 못했습니다.</td></tr>';
            });
    }

    // 3. 화면 렌더링 함수
    function renderOrderList(orders) {
        const tableBody = document.getElementById('orderListBody');
        tableBody.innerHTML = ''; // 초기화

        if (!orders || orders.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-4">거래 내역이 없습니다.</td></tr>';
            return;
        }

        // 최신순 정렬 (ID나 날짜 기준 내림차순 정렬이 안 되어 있다면 여기서 처리 가능)
        // orders.sort((a, b) => new Date(b.orderDate) - new Date(a.orderDate));

        orders.forEach(order => {
            // 날짜 포맷팅 (YYYY-MM-DD HH:mm:ss)
            const dateObj = new Date(order.orderDate); // 백엔드 필드명: orderDate 가정
            const dateStr = dateObj.toLocaleString('ko-KR');

            // 매수/매도 스타일에 따른 클래스 및 텍스트 설정
            // 백엔드 Enum이 'BUY', 'SELL'로 온다고 가정
            const isBuy = order.orderType === "매수";
            const typeBadgeClass = isBuy ? 'badge-buy' : 'badge-sell';
            const typeText = isBuy ? '매수' : '매도';
            const priceColorClass = isBuy ? 'text-buy' : 'text-sell';

            const row = `
                <tr>
                    <td class="text-secondary small">${dateStr}</td>
                    <td class="fw-bold">${order.stockName}</td>
                    <td><span class="badge ${typeBadgeClass}">${typeText}</span></td>
                    <td>${formatMoney(order.quantity)}주</td>
                    <td>${formatMoney(order.price)}원</td>
                    <td class="${priceColorClass}">${formatMoney(order.quantity * order.price)}원</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    // 숫자 콤마 포맷터
    const formatMoney = (num) => new Intl.NumberFormat('ko-KR').format(num);

</script>
</body>
</html>
