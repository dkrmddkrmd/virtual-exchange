<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 자산 현황</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-value { font-size: 1.5rem; font-weight: bold; }
        .positive { color: #dc3545; font-weight: bold; } /* 빨강 (수익) */
        .negative { color: #0d6efd; font-weight: bold; } /* 파랑 (손실) */
        .table th { background-color: #f8f9fa; }
    </style>
</head>
<body class="container mt-5 mb-5">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>💰 내 자산 현황</h1>
    <a href="/stocks" class="btn btn-outline-primary">주식 거래소로 이동</a>
</div>

<div class="row g-4 mb-5">
    <div class="col-md-4">
        <div class="card text-center h-100 shadow-sm">
            <div class="card-header bg-dark text-white">총 자산</div>
            <div class="card-body">
                <p class="card-value" id="totalAssetAmount">Loading...</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center h-100 shadow-sm">
            <div class="card-header bg-secondary text-white">예수금 (주문 가능)</div>
            <div class="card-body">
                <p class="card-value" id="balance">Loading...</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center h-100 shadow-sm">
            <div class="card-header">수익률</div>
            <div class="card-body">
                <p class="card-value" id="returnRate">Loading...</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center h-100 border-light">
            <div class="card-body">
                <h6 class="card-subtitle mb-2 text-muted">총 매수 금액</h6>
                <p class="card-text fs-4" id="totalPurchaseAmount">0 원</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center h-100 border-light">
            <div class="card-body">
                <h6 class="card-subtitle mb-2 text-muted">총 평가 금액</h6>
                <p class="card-text fs-4" id="totalEvaluationAmount">0 원</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center h-100 border-light">
            <div class="card-body">
                <h6 class="card-subtitle mb-2 text-muted">총 평가 손익</h6>
                <p class="card-text fs-4" id="totalProfitLoss">0 원</p>
            </div>
        </div>
    </div>
</div>

<h3 class="mb-3">📋 보유 주식 목록</h3>
<table class="table table-hover table-bordered align-middle text-center">
    <thead class="table-dark">
    <tr>
        <th>종목명</th>
        <th>보유수량</th>
        <th>평단가</th>
        <th>현재가</th>
        <th>평가금액</th>
        <th>평가손익</th>
        <th>수익률</th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody id="stockTableBody">
    </tbody>
</table>

<script>
    // 1. 유저 ID (임시)
    const USER_ID = 29;

    // 2. 페이지 로딩 시 데이터 가져오기
    document.addEventListener("DOMContentLoaded", () => {
        fetch(`/api/my-assets?userId=${USER_ID}`)
            .then(response => response.json())
            .then(data => {
                updateSummaryUI(data); // 카드 업데이트
                updateTableUI(data.stockHoldings); // 테이블 업데이트
            })
            .catch(error => console.error('Error:', error));
    });

    // 숫자 포맷터 (콤마 추가)
    const formatMoney = (num) => new Intl.NumberFormat('ko-KR').format(num);

    // [UI 1] 상단 요약 카드 업데이트
    function updateSummaryUI(data) {
        document.getElementById('totalAssetAmount').innerText = formatMoney(data.totalAssetAmount) + " 원";
        document.getElementById('balance').innerText = formatMoney(data.balance) + " 원";
        document.getElementById('totalPurchaseAmount').innerText = formatMoney(data.totalPurchaseAmount) + " 원";
        document.getElementById('totalEvaluationAmount').innerText = formatMoney(data.totalEvaluationAmount) + " 원";

        const profitLossElem = document.getElementById('totalProfitLoss');
        const returnRateElem = document.getElementById('returnRate');

        profitLossElem.innerText = (data.totalProfitLoss > 0 ? "+" : "") + formatMoney(data.totalProfitLoss) + " 원";
        returnRateElem.innerText = (data.returnRate > 0 ? "+" : "") + data.returnRate.toFixed(2) + " %";

        if (data.totalProfitLoss > 0) {
            profitLossElem.classList.add('positive');
            returnRateElem.classList.add('positive');
        } else if (data.totalProfitLoss < 0) {
            profitLossElem.classList.add('negative');
            returnRateElem.classList.add('negative');
        }
    }

    // [UI 2] 하단 보유 주식 테이블 업데이트
    function updateTableUI(stockHoldings) {
        const tableBody = document.getElementById('stockTableBody');
        tableBody.innerHTML = ''; // 기존 내용 초기화

        if (!stockHoldings || stockHoldings.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="8" class="py-4">보유 중인 주식이 없습니다.</td></tr>';
            return;
        }

        stockHoldings.forEach(holding => {
            // 계산 로직 (화면 표시용)
            const currentPrice = holding.stock.currentPrice;
            const avgPrice = holding.avgPrice;
            const quantity = holding.quantity;

            const valuationPrice = currentPrice * quantity; // 평가금액
            const profitLoss = (currentPrice - avgPrice) * quantity; // 평가손익
            let profitRate = 0;
            if (avgPrice > 0) {
                profitRate = ((currentPrice - avgPrice) / avgPrice) * 100;
            }

            // 색상 클래스 결정
            const colorClass = profitLoss > 0 ? 'positive' : (profitLoss < 0 ? 'negative' : '');
            const sign = profitLoss > 0 ? '+' : '';

            // 행(Row) 생성
            const row = `
                    <tr>
                        <td class="fw-bold">${holding.stock.name}</td>
                        <td>${quantity} 주</td>
                        <td>${formatMoney(Math.round(avgPrice))} 원</td>
                        <td>${formatMoney(currentPrice)} 원</td>
                        <td>${formatMoney(valuationPrice)} 원</td>
                        <td class="${colorClass}">${sign}${formatMoney(Math.round(profitLoss))} 원</td>
                        <td class="${colorClass}">${sign}${profitRate.toFixed(2)} %</td>
                        <td>
                            <button class="btn btn-danger btn-sm"
                                onclick="sellStock('${holding.stock.code}')">
                                매도
                            </button>
                        </td>
                    </tr>
                `;
            tableBody.innerHTML += row;
        });
    }

    // [기능] 매도 함수 (API 호출)
    function sellStock(code) {
        const quantity = prompt("매도할 수량을 입력하세요:", "1");
        if (!quantity) return; // 취소 누르면 종료

        const requestData = {
            userId: USER_ID,
            code: code,
            quantity: Number(quantity),
            orderType: 'SELL'
        };

        fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        })
            .then(async response => {
                if (response.ok) {
                    alert("매도 성공!");
                    window.location.reload(); // 새로고침하여 리스트 갱신
                } else {
                    const errorMsg = await response.text();
                    alert("매도 실패: " + errorMsg);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("서버 오류 발생");
            });
    }
</script>
</body>
</html>
