<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 자산 현황</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 깔끔한 테이블 헤더 */
        .table thead th {
            background-color: #f8f9fa; /* 밝은 회색 배경 */
            color: #212529;
            text-align: center;
            vertical-align: middle;
        }
        .table tbody td {
            vertical-align: middle;
            text-align: center;
        }
        /* 너무 쨍하지 않은 빨강/파랑 */
        .text-danger-custom { color: #d9534f; font-weight: bold; }
        .text-primary-custom { color: #0275d8; font-weight: bold; }
    </style>
</head>
<body class="container mt-5 mb-5">

<th:block th:replace="~{fragments/header :: headerFragment}"></th:block>

<h1 class="mb-4">💰 내 자산 현황</h1>

<div class="row mb-4">
    <div class="col-md-3">
        <div class="card shadow-sm">
            <div class="card-header bg-white fw-bold">총 자산</div>
            <div class="card-body">
                <h4 class="card-title text-primary" id="totalAsset">0 원</h4>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card shadow-sm">
            <div class="card-header bg-white fw-bold">예수금(현금)</div>
            <div class="card-body">
                <h4 class="card-title" id="balance">0 원</h4>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card shadow-sm">
            <div class="card-header bg-white fw-bold">총 매수 금액</div>
            <div class="card-body">
                <h4 class="card-title" id="totalPurchase">0 원</h4>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card shadow-sm">
            <div class="card-header bg-white fw-bold">총 평가 손익 (수익률)</div>
            <div class="card-body">
                <h4 class="card-title">
                    <span id="totalProfit">0 원</span>
                    <small id="returnRate" class="text-muted fs-6">(0.00%)</small>
                </h4>
            </div>
        </div>
    </div>
</div>

<h3 class="mb-3">보유 주식 목록</h3>
<div class="card shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>종목명</th>
                    <th>보유 수량</th>
                    <th>평균 단가</th>
                    <th>현재가</th>
                    <th>평가 금액</th>
                    <th>평가 손익</th>
                    <th>수익률</th>
                </tr>
                </thead>
                <tbody id="assetTableBody">
                <tr><td colspan="7" class="text-center py-4 text-muted">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetchMyAssets();
    });

    function fetchMyAssets() {
        fetch('/api/my-assets')
            .then(response => {
                if (!response.ok) throw new Error("데이터 조회 실패");
                return response.json();
            })
            .then(data => {
                renderAssets(data);
            })
            .catch(error => {
                console.error(error);
                document.getElementById('assetTableBody').innerHTML =
                    '<tr><td colspan="7" class="text-center py-4 text-danger">정보를 불러오지 못했습니다.</td></tr>';
            });
    }

    function renderAssets(data) {
        // 1. 상단 요약 정보 업데이트
        document.getElementById('totalAsset').innerText = formatMoney(data.totalAssetAmount) + ' 원';
        document.getElementById('balance').innerText = formatMoney(data.balance) + ' 원';
        document.getElementById('totalPurchase').innerText = formatMoney(data.totalPurchaseAmount) + ' 원';

        const profitElem = document.getElementById('totalProfit');
        const rateElem = document.getElementById('returnRate');

        profitElem.innerText = formatMoney(data.totalProfitLoss) + ' 원';
        rateElem.innerText = `(${data.returnRate.toFixed(2)}%)`;

        updateColor(profitElem, data.totalProfitLoss);
        updateColor(rateElem, data.totalProfitLoss);

        // 2. 테이블 리스트 업데이트
        const tbody = document.getElementById('assetTableBody');
        tbody.innerHTML = '';

        if (!data.holdingList || data.holdingList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">보유한 주식이 없습니다.</td></tr>';
            return;
        }

        data.holdingList.forEach(item => {
            // 수익/손실 계산 (백엔드 DTO에 이 필드들이 있다고 가정)
            const profitLoss = item.evaluationAmount - item.purchaseAmount;
            const rate = item.purchaseAmount > 0 ? (profitLoss / item.purchaseAmount) * 100 : 0;

            const profitClass = profitLoss > 0 ? 'text-danger-custom' : (profitLoss < 0 ? 'text-primary-custom' : '');

            const row = `
                <tr>
                    <td class="fw-bold">${item.stockName}</td>
                    <td>${formatMoney(item.quantity)}주</td>
                    <td>${formatMoney(item.avgPrice)}원</td>
                    <td>${formatMoney(item.currentPrice)}원</td>
                    <td>${formatMoney(item.evaluationAmount)}원</td>
                    <td class="${profitClass}">${formatMoney(profitLoss)}원</td>
                    <td class="${profitClass}">${rate.toFixed(2)}%</td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    function formatMoney(num) {
        return new Intl.NumberFormat('ko-KR').format(num);
    }

    function updateColor(element, value) {
        element.classList.remove('text-danger-custom', 'text-primary-custom', 'text-muted');
        if (value > 0) element.classList.add('text-danger-custom');
        else if (value < 0) element.classList.add('text-primary-custom');
        else element.classList.add('text-muted');
    }
</script>
</body>
</html>
