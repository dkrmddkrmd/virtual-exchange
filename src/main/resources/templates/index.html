<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>가상 주식 거래소 - 홈</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5 text-center">

<div class="py-5">
    <h1 class="display-4 fw-bold">📈 Virtual Exchange</h1>
    <p class="lead text-muted">실전 같은 모의 주식 투자 플랫폼</p>
</div>

<div sec:authorize="isAnonymous()" class="mb-5">
    <a href="/login" class="btn btn-primary btn-lg px-4 gap-3">로그인 하러 가기</a>
    <a href="/signup" class="btn btn-outline-secondary btn-lg px-4">회원가입</a>
</div>

<div sec:authorize="isAuthenticated()" class="mb-5">
    <h3>반갑습니다, <span sec:authentication="name" class="text-primary">User</span>님!</h3>
    <p>오늘도 성공적인 투자를 기원합니다.</p>

    <div class="d-grid gap-3 d-sm-flex justify-content-sm-center mt-4">
        <a href="/stocks" class="btn btn-success btn-lg px-4">📊 주식 거래소</a>
        <a href="/my-assets" class="btn btn-warning btn-lg px-4">💰 내 자산 현황</a>
        <a href="/orders/list" class="btn btn-info btn-lg px-4">📜 거래 내역</a>
    </div>

    <div class="mt-5">
        <form action="/members/logout" method="post">
            <button type="submit" class="btn btn-dark">로그아웃</button>
        </form>
    </div>
</div>

</body>
</html>
