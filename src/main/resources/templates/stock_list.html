<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>가상 주식 거래소</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<div th:replace="~{fragments/header :: headerFragment}"></div>

<h1 class="mb-4">📈 실시간 주식 시세</h1>

<table class="table table-hover table-bordered align-middle">
    <thead class="table-dark">
    <tr>
        <th>종목 코드</th>
        <th>종목명</th>
        <th>현재가 (KRW)</th>
        <th>주문 (매수/매도)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="stock : ${stocks}">
        <td th:text="${stock.code}">KRW-BTC</td>
        <td th:text="${stock.name}">비트코인</td>
        <td th:text="${#numbers.formatInteger(stock.currentPrice, 0, 'COMMA')} + ' 원'">100,000,000 원</td>

        <td>
            <div class="d-flex gap-2">
                <input type="number" class="form-control" style="width: 80px;"
                       th:id="|quantity_${stock.code}|" placeholder="수량" value="1">

                <button class="btn btn-success btn-sm"
                        th:data-code="${stock.code}"
                        onclick="orderStock(this.getAttribute('data-code'), 'BUY')">
                    매수
                </button>

                <button class="btn btn-danger btn-sm"
                        th:data-code="${stock.code}"
                        onclick="orderStock(this.getAttribute('data-code'), 'SELL')">
                    매도
                </button>
            </div>
        </td>
    </tr>
    </tbody>
</table>

<script>
    function orderStock(stockCode, type) {
        const quantityInput = document.getElementById('quantity_' + stockCode);
        const quantity = quantityInput.value;

        if (!quantity || quantity <= 0) {
            alert("올바른 수량을 입력해주세요.");
            return;
        }

        const requestData = {
            code: stockCode,
            quantity: Number(quantity),
            orderType: type
        };

        fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        })
            .then(async response => {
                if (response.ok) {
                    const msg = await response.text();
                    alert(msg || "주문 접수 완료");

                    setTimeout(() => {
                        window.location.reload();
                    }, 500);
                } else {
                    const errorMsg = await response.text();
                    alert("주문 실패: " + errorMsg);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("서버 통신 중 오류가 발생했습니다.");
            });
    }
</script>

</body>
</html>
