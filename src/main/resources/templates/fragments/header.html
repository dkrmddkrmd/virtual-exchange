<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="headerFragment">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">📈 Virtual Exchange</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">홈</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/stocks">주식 거래소</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/orders/list">거래 내역</a>
                    </li>
                </ul>

                <div class="d-flex">
                    <div sec:authorize="isAnonymous()">
                        <a href="/login" class="btn btn-outline-light me-2">로그인</a>
                        <a href="/signup" class="btn btn-warning">회원가입</a>
                    </div>

                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                        <span class="text-white me-3">
                            <span sec:authentication="principal.user.name" class="fw-bold">User</span>님
                        </span>
                        <form action="/logout" method="post" style="margin:0;">
                            <button type="submit" class="btn btn-outline-danger btn-sm">로그아웃</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</div>
</html>
