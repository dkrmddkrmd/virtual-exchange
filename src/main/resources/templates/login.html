<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 가상 주식 거래소</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2 class="text-center mb-4">🔐 로그인</h2>

    <div th:if="${param.error}" class="alert alert-danger text-center">
        이메일 또는 비밀번호가 올바르지 않습니다.
    </div>

    <div th:if="${param.logout}" class="alert alert-success text-center">
        성공적으로 로그아웃 되었습니다.
    </div>

    <form action="/login" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="text" class="form-control" id="email" name="email" placeholder="user@example.com" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">로그인 하기</button>
    </form>

    <div class="mt-3 text-center">
        <a href="/members/new" class="text-decoration-none">회원가입</a> |
        <a href="/" class="text-decoration-none text-secondary">메인으로</a>
    </div>
</div>

</body>
</html>
