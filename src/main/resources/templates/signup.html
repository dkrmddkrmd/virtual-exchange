<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - Virtual Exchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 로그인 폼처럼 가운데 정렬하기 위한 간단한 스타일 */
        html, body { height: 100%; }
        .form-signin {
            max-width: 400px;
            padding: 15px;
            margin: auto;
        }
        .main-container {
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
            min-height: calc(100vh - 56px); /* 헤더 높이 제외 */
        }
    </style>
</head>
<body class="bg-light">

<th:block th:replace="~{fragments/header :: headerFragment}"></th:block>

<div class="main-container">
    <main class="form-signin w-100 m-auto">
        <form id="signupForm">
            <h1 class="h3 mb-3 fw-normal text-center">회원가입</h1>

            <div class="form-floating mb-2">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                <label for="email">이메일 주소</label>
            </div>

            <div class="form-floating mb-2">
                <input type="text" class="form-control" id="name" placeholder="홍길동" required>
                <label for="name">이름</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <label for="password">비밀번호</label>
            </div>

            <button class="w-100 btn btn-lg btn-primary" type="submit">가입하기</button>
            <p class="mt-3 text-muted text-center">
                이미 계정이 있으신가요? <a href="/login" class="text-decoration-none">로그인</a>
            </p>
        </form>
    </main>
</div>

<script>
    document.getElementById('signupForm').addEventListener('submit', function(event) {
        // 1. 폼의 기본 제출 동작을 막습니다.
        event.preventDefault();

        // 2. 입력값 가져오기
        const email = document.getElementById('email').value;
        const name = document.getElementById('name').value;
        const password = document.getElementById('password').value;

        // 3. 보낼 데이터를 JSON 객체로 만듭니다. (우리가 만든 DTO와 모양이 같아야 함)
        const signupData = {
            email: email,
            name: name,
            password: password
        };

        // 4. fetch API를 사용해 서버로 전송합니다.
        fetch('/api/users', { // 우리가 만든 백엔드 API 주소
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                // 나중에 시큐리티 CSRF 토큰이 필요해지면 여기에 추가해야 함
            },
            body: JSON.stringify(signupData) // 객체를 JSON 문자열로 변환
        })
            .then(response => {
                if (response.ok) {
                    // 성공 시 (200 OK)
                    alert("회원가입이 완료되었습니다! 로그인해주세요.");
                    window.location.href = "/login"; // 로그인 페이지로 이동
                } else {
                    // 실패 시 (예: 중복 이메일 등 서버에서 에러 메시지를 보낸 경우)
                    response.text().then(text => alert("가입 실패: " + text));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("서버와 통신 중 오류가 발생했습니다.");
            });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
